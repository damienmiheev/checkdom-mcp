[package]
name = "checkdom-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Unofficial Model Context Protocol (MCP) server for the CheckDom resident dashboard (checkdom.in.ua): read your bills, support requests, messages and votes, and file requests, from an AI assistant."
authors = ["damienmiheev and the checkdom-mcp contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/damienmiheev/checkdom-mcp"
homepage = "https://github.com/damienmiheev/checkdom-mcp"
readme = "README.md"
keywords = ["mcp", "checkdom", "osbb", "claude", "ai"]
categories = ["command-line-utilities", "api-bindings"]

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.13"
dirs = "7.0"
rpassword = "7.5"
toml = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
# See CLAUDE.md: no unwrap/expect outside tests (clippy.toml allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
