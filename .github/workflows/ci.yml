name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly cargo deny: a new advisory against a released dependency shows up
  # without a code change.
  schedule:
    - cron: "17 6 * * 1"
  # Manual run: checks everything.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to main are
# grouped by commit, so every commit on main gets a full result (one group per
# ref would let GitHub drop a pending run when commits land quickly).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

# Jobs are skipped only when every changed file is documentation; any other
# file (including kinds added later) runs the full build. Scheduled and manual
# runs check everything. "CI result" is the one required check and passes when
# every job that ran passed (skipped jobs are fine).
jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      readme: ${{ steps.filter.outputs.readme }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      # Third-party actions are pinned to commit SHAs (SECURITY.md § Supply chain).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent (the base).
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: >-
          .github/scripts/changes.sh
          'rust!=^(docs/|[^/]+\.md$|LICENSE-(MIT|APACHE)$|\.claude/|\.github/(dependabot\.yml|pull_request_template\.md)$)'
          'readme=^README\.md$'
          'deps=^(Cargo\.(toml|lock)|deny\.toml|rust-toolchain\.toml|\.github/workflows/ci\.yml|\.github/scripts/changes\.sh)$'

  check:
    name: fmt, clippy, test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Only main writes caches; pull requests and the README job restore from them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --locked

  # The README's tool tables are tested against the server, so a README-only
  # change still runs that one test (on one OS, not the full matrix).
  readme:
    name: README matches the server
    needs: changes
    if: needs.changes.outputs.rust != 'true' && needs.changes.outputs.readme == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ubuntu-latest
          save-if: false
      # --exact, and require that exactly one test ran: a renamed test must
      # fail this job, not pass it with zero tests.
      - run: |
          cargo test --all-features --locked --test stdio -- --exact readme_tool_tables_match_the_server | tee test.log
          grep -q 'test result: ok. 1 passed' test.log

  # Offline tests of scripts/api-inventory.py (the weekly API drift check).
  scripts:
    name: inventory script tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s scripts -v

  # Supply-chain audit: advisories, licenses, bans, sources.
  deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  result:
    name: CI result
    needs: [changes, check, readme, scripts, deny]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Summary
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
