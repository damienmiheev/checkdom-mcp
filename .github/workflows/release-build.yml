# Builds everything a release ships: checkdom-mcp for macOS, Linux and Windows
# (arm64 and x86_64), each archive with licence notices and a CycloneDX SBOM,
# and SHA256SUMS over the archives. For a tag it also attests the build
# provenance of every archive, creates a draft GitHub release with them and the
# CHANGELOG section, then starts Release sign, which waits for the owner's
# approval and then signs and publishes it (RELEASE.md). It never signs or
# publishes itself. Run by hand on a branch, or on a pull request that changes the
# release machinery, it only builds (a dry run).
name: Release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release-build.yml
      - scripts/release-info.sh
      - scripts/licenses.sh
      - about.toml
      - about.hbs
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Third-party actions are pinned to commit SHAs (SECURITY.md § Supply chain).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(scripts/release-info.sh version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag must name the version in Cargo.toml (tag v0.1.0 -> 0.1.0).
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi

  notices:
    name: Licence notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: scripts/licenses.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  sbom:
    name: SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      # One SBOM per target, from Cargo.lock and that target's dependencies.
      - name: Write the SBOMs
        run: |
          mkdir sbom
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            cargo cyclonedx -q --format json --spec-version 1.5 --target "$target"
            mv checkdom-mcp.cdx.json "sbom/checkdom-mcp-$target.cdx.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: [version, notices, sbom]
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest supported runner image: the binaries need its
        # glibc (2.35) or newer. `run` = the runner can execute the binary.
        include:
          - { target: aarch64-apple-darwin, os: macos-15, run: true }
          - { target: x86_64-apple-darwin, os: macos-15, run: false }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, run: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, run: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: true }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, run: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml and the target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install && rustup target add "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: Package
        id: package
        env:
          NAME: checkdom-mcp-${{ needs.version.outputs.version }}-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
          RUN: ${{ matrix.run }}
        run: |
          exe=checkdom-mcp
          [[ $TARGET == *windows* ]] && exe=checkdom-mcp.exe
          bin="target/$TARGET/release/$exe"
          if [[ $RUN == true ]]; then "$bin" --version; fi
          mkdir -p "dist/$NAME"
          cp "$bin" README.md SECURITY.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.txt "dist/$NAME/"
          cp "sbom/checkdom-mcp-$TARGET.cdx.json" "dist/$NAME/checkdom-mcp.cdx.json"
          cd dist
          if [[ $TARGET == *windows* ]]; then
            archive="$NAME.zip"
            7z a -tzip -bso0 "$archive" "$NAME"
          else
            archive="$NAME.tar.gz"
            tar -czf "$archive" "$NAME"
          fi
          python3 -c 'import hashlib, sys; p = sys.argv[1]; print(hashlib.sha256(open(p, "rb").read()).hexdigest() + "  " + p)' \
            "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
      - run: |
          cat -- *.sha256 | sort -k2 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" = 6 ] || { echo "::error::expected 6 archives"; exit 1; }
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: SHA256SUMS
          if-no-files-found: error

  # Signed by Sigstore through GitHub's OIDC token, which only this job can
  # request: it builds nothing and runs no repository code. Tags only, so dry
  # runs leave no attestations. `gh attestation verify <file> --repo
  # damienmiheev/checkdom-mcp` checks one.
  attest:
    name: Attest provenance
    if: github.ref_type == 'tag'
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

  draft:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, checksums, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: dist
      # The CHANGELOG section of this version, then how to check the files.
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The section ends at the next "## " heading outside a code block.
          awk -v v="## $VERSION " '
            index($0, v) == 1 { on = 1; next }
            on && /^```/ { fenced = !fenced }
            on && !fenced && /^## / { exit }
            on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG section for $VERSION"; exit 1; }
          key=$(scripts/release-info.sh signing-key)
          cat >> notes.md <<NOTES

          ---

          **Install:** download the archive for your platform, unpack it and follow
          [GETTING_STARTED.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/GETTING_STARTED.md).
          macOS binaries are not notarized: run \`xattr -d com.apple.quarantine checkdom-mcp\` once.

          **Verify** (recommended):

          \`\`\`
          minisign -Vm SHA256SUMS -P $key
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify <archive> --repo $GITHUB_REPOSITORY
          \`\`\`
          NOTES
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          case "$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null)" in
            "") gh release create "$TAG" --draft --verify-tag --title "checkdom-mcp $VERSION" \
                  --notes-file notes.md dist/*.tar.gz dist/*.zip dist/SHA256SUMS ;;
            true) gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.zip dist/SHA256SUMS &&
                  gh release edit "$TAG" --notes-file notes.md ;;
            *) echo "::error::$TAG is published already"; exit 1 ;;
          esac
      # Release sign checks this run's files, then waits for the owner's
      # approval before it can use the signing key.
      - name: Start Release sign
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run release-sign.yml --ref main -f tag="$TAG" -f run="$GITHUB_RUN_ID"
