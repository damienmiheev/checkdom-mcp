# cargo-deny configuration. Run locally with `cargo deny check`.
# CI runs this as a soft gate for now (see .github/workflows/ci.yml).

[advisories]
version = 2
yanked = "deny"
# Add RustSec advisory IDs here with a reason if one must be temporarily allowed.
ignore = []

[licenses]
version = 2
# Permissive licenses plus MPL-2.0 and Unicode, which the TLS/parsing stack pulls in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.8

# `ring` ships a bundled license that cargo-deny reads from a file.
[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
