# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
# CI runs this as a required check on every push and pull request, and weekly.

[graph]
all-features = true
# The platforms we build and ship (RELEASE.md); dependencies only used on
# others (e.g. Android's jni via rustls-platform-verifier) are out of scope.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
# RustSec advisories; vulnerable, unmaintained and yanked crates fail the check.
yanked = "deny"
# Ignored only with a reason; recheck every entry on each dependency upgrade.
ignore = []

[licenses]
# Permissive licenses only (SECURITY.md § Supply chain).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # webpki-roots ships Mozilla's CA list under the Community Data License (permissive).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: don't warn about licenses no crate uses yet.
unused-allowed-license = "allow"

[bans]
# Duplicates come from transitive dependencies; reported, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# TLS is rustls only (SECURITY.md § Supply chain): no OpenSSL linkage.
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
